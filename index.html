<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bienvenidos a Ocean Blue</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: linear-gradient(135deg, #02111b 0%, #002b49 50%, #00497a 100%);
      color: #ffffff;
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      overflow-x: hidden;
      position: relative;
      padding: 30px 15px;
    }

    body::after {
      content: "";
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: radial-gradient(circle at 50% 50%, rgba(255, 117, 24, 0.15), transparent 70%);
      pointer-events: none;
    }

    /* ELEMENTOS TENEBROSOS DIFUMINADOS EN EL FONDO BASE */
    .bg-spooky {
      position: fixed;
      pointer-events: none;
      z-index: 0;
      opacity: 0.38;
      font-size: 4rem;
      filter: blur(5px) drop-shadow(0 0 15px rgba(255, 117, 24, 0.7));
      animation: spookyRocking 4s ease-in-out infinite alternate;
      user-select: none;
    }

    .bg-spooky-1 { top: 4%; left: 3%; font-size: 4.8rem; animation-delay: 0s; }
    .bg-spooky-2 { top: 8%; right: 4%; font-size: 5.5rem; animation-delay: 0.8s; }
    .bg-spooky-5 { top: 68%; left: 3%; font-size: 5rem; animation-delay: 0.5s; }
    .bg-spooky-6 { top: 72%; right: 4%; font-size: 4.5rem; animation-delay: 1.2s; }
    .bg-spooky-7 { bottom: 3%; left: 8%; font-size: 5.2rem; animation-delay: 2.8s; }
    .bg-spooky-8 { bottom: 4%; right: 8%; font-size: 4.8rem; animation-delay: 1.9s; }

    .bg-spooky-center-1 { top: 22%; left: 2%; font-size: 4.2rem; animation-delay: 0.3s; }
    .bg-spooky-center-2 { top: 26%; right: 2%; font-size: 4.5rem; animation-delay: 1.1s; }
    .bg-spooky-center-3 { top: 42%; left: 1%; font-size: 4rem; animation-delay: 2.0s; }
    .bg-spooky-center-4 { top: 46%; right: 1%; font-size: 4.8rem; animation-delay: 1.6s; }
    .bg-spooky-center-5 { top: 58%; left: 2%; font-size: 4.3rem; animation-delay: 0.7s; }
    .bg-spooky-center-6 { top: 62%; right: 2%; font-size: 4.6rem; animation-delay: 2.4s; }

    @keyframes spookyRocking {
      0% {
        transform: rotate(-25deg) scale(0.95);
        opacity: 0.28;
      }
      100% {
        transform: rotate(25deg) scale(1.1);
        opacity: 0.50;
      }
    }

    /* OVERLAY DE HALLOWEEN */
    #halloween-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(2, 17, 27, 0.65);
      z-index: 100;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding-top: 5vh;
      overflow: hidden;
      pointer-events: none;
      transition: opacity 1.2s ease, visibility 1.2s ease;
    }

    .halloween-container {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      width: 100%;
      max-width: 500px;
      height: 100%;
    }

    /* DULCE UBICADO JUSTO DEBAJO DE LAS PATAS DE LA ARAÑA */
    .candy-target {
      position: absolute;
      top: 310px;
      z-index: 5;
      width: 85px;
      height: auto;
      filter: drop-shadow(0 0 15px rgba(255, 117, 24, 0.95));
      animation: candyGrabAndAscend 4.5s cubic-bezier(0.1, 0.9, 0.2, 1) forwards;
    }

    @keyframes candyGrabAndAscend {
      0% {
        opacity: 0;
        transform: scale(0.2);
      }
      12% {
        opacity: 1;
        transform: scale(1);
      }
      /* Espera abajo flotando */
      30% {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
      /* La araña cae brusca sobre él */
      33% {
        transform: translateY(10px) scale(1.05);
      }
      /* Permanece junto con la araña abajo */
      36% {
        transform: translateY(3px) rotate(-3deg);
      }
      45% {
        transform: translateY(7px) rotate(3deg);
      }
      55% {
        transform: translateY(3px) rotate(-1deg);
      }
      /* Sube SIMULTÁNEAMENTE con la araña a la misma velocidad */
      85% {
        opacity: 1;
        transform: translateY(-130vh) rotate(0deg);
      }
      100% {
        opacity: 0;
        transform: translateY(-130vh);
      }
    }

    /* ESCENA ARAÑA QUE CAE BRUSCA Y SUBE EN SINCRO CON EL DULCE */
    .spider-stage {
      position: absolute;
      top: 0;
      width: 380px;
      height: 100%;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      z-index: 4;
    }

    .spider-hanger {
      position: absolute;
      top: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      transform-origin: top center;
      transform: translateY(-130vh);
      animation: spiderJumpscareSync 4.5s cubic-bezier(0.1, 0.9, 0.2, 1) forwards;
    }

    @keyframes spiderJumpscareSync {
      0%, 20% {
        transform: translateY(-130vh);
      }
      /* Caída súper brusca (Jumpscare) */
      30% {
        transform: translateY(115px);
      }
      33% {
        transform: translateY(125px); /* Contacto exacto con el dulce */
      }
      /* Permanece en pantalla sujetándolo */
      36% {
        transform: translateY(118px) rotate(-3deg);
      }
      45% {
        transform: translateY(122px) rotate(3deg);
      }
      55% {
        transform: translateY(118px) rotate(-1deg);
      }
      /* Sube SIMULTÁNEAMENTE con el dulce */
      85% {
        transform: translateY(-130vh) rotate(0deg);
      }
      100% {
        transform: translateY(-130vh);
      }
    }

    /* HILO DE TELARAÑA */
    .spider-thread {
      width: 3px;
      height: 200px;
      background: linear-gradient(to bottom, rgba(255,255,255,0.1), #ffffff);
      box-shadow: 0 0 10px rgba(255, 255, 255, 1);
    }

    /* ARAÑA GIGANTE */
    .spider-img {
      width: 210px;
      height: auto;
      filter: drop-shadow(0 0 22px rgba(255, 117, 24, 0.95));
      margin-top: -5px;
    }

    /* CARTEL COLGANTE QUE CAE TRAS LA HUIDA */
    .hanging-sign-wrapper {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      transform-origin: top center;
      z-index: 6;
      opacity: 0;
      transform: translateY(-120vh);
      /* Cae tras completarse el robo */
      animation: dropSignSmooth 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) 3.8s forwards,
                 signSwing 3.5s ease-in-out infinite alternate 5.0s;
    }

    @keyframes dropSignSmooth {
      0% {
        opacity: 0;
        transform: translateY(-120vh);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .sign-rope-left, .sign-rope-right {
      position: absolute;
      top: -120px;
      width: 2px;
      height: 125px;
      background: linear-gradient(to bottom, rgba(255,255,255,0.3), #ff7518);
      box-shadow: 0 0 4px rgba(255, 117, 24, 0.8);
    }

    .sign-rope-left { left: 15%; }
    .sign-rope-right { right: 15%; }

    .halloween-title-board {
      font-family: 'Fredoka', cursive, sans-serif;
      font-size: 1.4rem;
      font-weight: 700;
      color: #ffffff;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      padding: 14px 24px;
      background: linear-gradient(135deg, #240046, #5a189a, #ff7518);
      border: 3px solid #ff7518;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6), 0 0 20px rgba(255, 117, 24, 0.8);
      transform: rotate(-6deg);
      max-width: 340px;
      line-height: 1.3;
    }

    @keyframes signSwing {
      0% { transform: rotate(-3deg); }
      100% { transform: rotate(3deg); }
    }

    /* LLUVIA DE ELEMENTOS DE HALLOWEEN */
    .falling-item {
      position: fixed;
      top: -12%;
      user-select: none;
      pointer-events: none;
      z-index: 99;
      animation: fall linear forwards;
    }

    @keyframes fall {
      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 1;
      }
      100% {
        transform: translateY(108vh) rotate(360deg);
        opacity: 0;
      }
    }

    /* HEADER DE LA PÁGINA */
    .header-container {
      text-align: center;
      margin-bottom: 25px;
      z-index: 2;
      padding: 0 10px;
      position: relative;
    }

    .header-container::before {
      content: "🕸️";
      position: absolute;
      top: -15px;
      left: -10px;
      font-size: 2.2rem;
      opacity: 0.85;
      filter: drop-shadow(0 0 6px #ff7518);
    }

    .header-container::after {
      content: "🕷️";
      position: absolute;
      bottom: -10px;
      right: -5px;
      font-size: 1.8rem;
      opacity: 0.9;
      filter: drop-shadow(0 0 8px #ff7518);
    }

    h1 {
      font-family: 'Fredoka', cursive, sans-serif;
      font-size: 2.8rem;
      font-weight: 700;
      color: #ff7518;
      text-transform: uppercase;
      line-height: 1.1;
      letter-spacing: 1.5px;
      -webkit-text-stroke: 1.5px #7209b7;
      animation: neonStrokeFlowHalloween 3s linear infinite;
      position: relative;
    }

    .subtitle {
      font-family: 'Poppins', sans-serif;
      font-size: 1.1rem;
      font-weight: 400;
      color: #ffb703;
      margin-top: 10px;
      letter-spacing: 0.8px;
      filter: drop-shadow(0 0 6px #ff7518);
    }

    @keyframes neonStrokeFlowHalloween {
      0% { filter: drop-shadow(4px 0px 4px #ff7518) drop-shadow(-4px 0px 12px #7209b7); }
      25% { filter: drop-shadow(0px 4px 4px #ff9e00) drop-shadow(0px -4px 12px #9d4edd); }
      50% { filter: drop-shadow(-4px 0px 4px #ff7518) drop-shadow(4px 0px 12px #7209b7); }
      75% { filter: drop-shadow(0px -4px 4px #ff9e00) drop-shadow(0px 4px 12px #9d4edd); }
      100% { filter: drop-shadow(4px 0px 4px #ff7518) drop-shadow(-4px 0px 12px #7209b7); }
    }

    .layout-container {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      max-width: 500px;
      z-index: 2;
    }

    .whirlpool-bg {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 400px;
      height: 400px;
      border-radius: 50%;
      background: conic-gradient(from 0deg, transparent, #7209b7, #ff7518, #ff9e00, transparent 80%);
      animation: spin 10s linear infinite;
      filter: blur(14px);
      box-shadow: 0 0 50px rgba(255, 117, 24, 0.4);
      z-index: 1;
      opacity: 0.5;
      pointer-events: none;
    }

    @keyframes spin {
      0% { transform: translate(-50%, -50%) rotate(0deg); }
      100% { transform: translate(-50%, -50%) rotate(360deg); }
    }

    .carrusel {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      gap: 25px;
      width: 100%;
      align-items: center;
    }

    .carta {
      position: relative;
      width: 100%;
      max-width: 400px;
      height: auto;
      border-radius: 20px;
      overflow: hidden;
      flex-shrink: 0;
      transition: transform 0.3s;
      background: #00121e;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3px;
    }

    .carta::before {
      content: '';
      position: absolute;
      width: 150%;
      height: 150%;
      background: conic-gradient(transparent, #ff7518, #9d4edd, transparent 40%);
      animation: rotateBorder 4s linear infinite;
    }

    .carta::after {
      content: '';
      position: absolute;
      inset: 3px;
      background: #00121e;
      border-radius: 17px;
      z-index: 1;
    }

    @keyframes rotateBorder {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .carta:hover, .carta:active {
      transform: scale(1.02);
    }

    .carta img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 17px;
      position: relative;
      z-index: 2;
    }

    .notice-card {
      margin-top: 35px;
      width: 100%;
      max-width: 400px;
      background: rgba(0, 27, 46, 0.85);
      border: 2px solid #ff7518;
      border-radius: 20px;
      padding: 20px 22px;
      text-align: center;
      box-shadow: 0 0 25px rgba(255, 117, 24, 0.3), inset 0 0 15px rgba(114, 9, 183, 0.2);
      backdrop-filter: blur(8px);
      z-index: 2;
      position: relative;
    }

    .notice-card p {
      font-family: 'Fredoka', cursive, sans-serif;
      font-size: 1.25rem;
      font-weight: 500;
      color: #ffe5ec;
      line-height: 1.45;
      letter-spacing: 0.3px;
    }

    .notice-card span.highlight {
      color: #ff7518;
      font-weight: 700;
      text-shadow: 0 0 8px rgba(255, 117, 24, 0.8);
    }

    .modal {
      display: none;
      position: fixed;
      z-index: 10;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      overflow: auto;
      background-color: rgba(0, 18, 30, 0.95);
      backdrop-filter: blur(5px);
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 10px;
    }

    .modal-content-wrapper {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 95%;
      max-height: 80vh;
    }

    .modal-content {
      width: 100%;
      max-height: 75vh;
      border-radius: 18px;
      box-shadow: 0 0 40px rgba(255, 117, 24, 0.5);
      border: 3px solid #ff7518;
      animation: zoom 0.3s;
      object-fit: contain;
    }

    .fade-anim {
      animation: fadeEffect 0.3s ease-in-out;
    }

    @keyframes zoom {
      from {transform:scale(0.7); opacity: 0;}
      to {transform:scale(1); opacity: 1;}
    }

    @keyframes fadeEffect {
      from {opacity: 0.3; transform: scale(0.97);}
      to {opacity: 1; transform: scale(1);}
    }

    .close {
      position: fixed;
      top: 15px;
      right: 15px;
      color: #ff7518;
      font-size: 35px;
      font-weight: bold;
      transition: 0.3s;
      cursor: pointer;
      z-index: 12;
      line-height: 1;
      background-color: rgba(0, 18, 30, 0.8);
      border: 1px solid #ff7518;
      border-radius: 50%;
      width: 45px;
      height: 45px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .close:hover {
      color: #ffffff;
    }

    .controls-bar {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      margin-top: 15px;
      z-index: 11;
    }

    .nav-btn {
      background-color: rgba(36, 0, 70, 0.9);
      color: #ff7518;
      font-size: 20px;
      font-weight: bold;
      border: 2px solid #ff7518;
      padding: 8px 20px;
      border-radius: 25px;
      cursor: pointer;
      transition: 0.3s;
      user-select: none;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
    }

    .nav-btn:active {
      background-color: #ff7518;
      color: #00121e;
    }

    /* AJUSTES PARA MÓVILES */
    @media (max-width: 600px) {
      h1 { font-size: 2.2rem; }
      .subtitle { font-size: 0.95rem; }
      .halloween-title-board { font-size: 1.15rem; padding: 10px 18px; max-width: 280px; }
      .spider-stage { width: 310px; }
      .spider-img { width: 160px; }
      .candy-target { width: 70px; top: 280px; }
      .notice-card p { font-size: 1.1rem; }
      .whirlpool-bg { width: 300px; height: 300px; }

      .bg-spooky {
        font-size: 3.2rem;
        filter: blur(3px) drop-shadow(0 0 10px rgba(255, 117, 24, 0.8));
      }

      .bg-spooky-center-1 { left: -10px; font-size: 3.5rem; }
      .bg-spooky-center-2 { right: -10px; font-size: 3.8rem; }
      .bg-spooky-center-3 { left: -8px; font-size: 3.2rem; }
      .bg-spooky-center-4 { right: -8px; font-size: 3.6rem; }
      .bg-spooky-center-5 { left: -10px; font-size: 3.5rem; }
      .bg-spooky-center-6 { right: -10px; font-size: 3.7rem; }
    }
  </style>
</head>
<body>

  <!-- ELEMENTOS TENEBROSOS EN EL FONDO -->
  <div class="bg-spooky bg-spooky-1">🎃</div>
  <div class="bg-spooky bg-spooky-2">💀</div>

  <div class="bg-spooky bg-spooky-center-1">🕷️</div>
  <div class="bg-spooky bg-spooky-center-2">🎃</div>
  <div class="bg-spooky bg-spooky-center-3">🦇</div>
  <div class="bg-spooky bg-spooky-center-4">👻</div>
  <div class="bg-spooky bg-spooky-center-5">☠️</div>
  <div class="bg-spooky bg-spooky-center-6">🕸️</div>

  <div class="bg-spooky bg-spooky-5">🎃</div>
  <div class="bg-spooky bg-spooky-6">💀</div>
  <div class="bg-spooky bg-spooky-7">🦇</div>
  <div class="bg-spooky bg-spooky-8">🕷️</div>

  <!-- OVERLAY DE HALLOWEEN -->
  <div id="halloween-overlay">
    <div class="halloween-container">
      
      <!-- DULCE UBICADO JUSTO DEBAJO DE LAS PATAS DE LA ARAÑA -->
      <img src="dulce.png" class="candy-target" alt="Dulce">

      <!-- CARTEL COLGANTE EN DIAGONAL -->
      <div class="hanging-sign-wrapper">
        <div class="sign-rope-left"></div>
        <div class="sign-rope-right"></div>
        <div class="halloween-title-board">
          Ocean Blue les desea un feliz Halloween
        </div>
      </div>

      <!-- ARAÑA QUE CAE Y SUBE JUNTO AL DULCE -->
      <div class="spider-stage">
        <div class="spider-hanger">
          <div class="spider-thread"></div>
          <img src="arana.png" class="spider-img" alt="Araña">
        </div>
      </div>

    </div>
  </div>

  <div class="header-container">
    <h1>Bienvenidos a Ocean Blue</h1>
    <p class="subtitle">Es un placer que nos visiten</p>
  </div>

  <div class="layout-container">
    <div class="whirlpool-bg"></div>

    <div class="carrusel">
      <div class="carta"><img src="imagen1.png" alt="Carta 1" class="clickable-img"></div>
      <div class="carta"><img src="imagen2.png" alt="Carta 2" class="clickable-img"></div>
      <div class="carta"><img src="imagen3.png" alt="Carta 3" class="clickable-img"></div>
      <div class="carta"><img src="imagen4.png" alt="Carta 4" class="clickable-img"></div>
    </div>
  </div>

  <div class="notice-card">
    <p>Hola, ¿ya revisaste bien nuestro menú? Recuerda que somos <span class="highlight">autoservicio</span>, el siguiente paso es acercarte a caja para realizar tu pedido, ¡muchas gracias por tu compra!</p>
  </div>

  <div id="myModal" class="modal">
    <span class="close">&times;</span>
    <div class="modal-content-wrapper">
      <img class="modal-content" id="img01">
      <div class="controls-bar">
        <button class="nav-btn" id="prevBtn">&#10094; Anterior</button>
        <button class="nav-btn" id="nextBtn">Siguiente &#10095;</button>
      </div>
    </div>
  </div>

  <script>
    function createFallingElement() {
      const item = document.createElement('div');
      item.classList.add('falling-item');
      
      const itemsList = [
        '🎃', '💀', '☠️', '🕷️', '🕸️', '🦇', '👻'
      ];
      
      const selectedItem = itemsList[Math.floor(Math.random() * itemsList.length)];
      item.innerText = selectedItem;
      
      item.style.left = Math.random() * 100 + 'vw';
      item.style.animationDuration = Math.random() * 2 + 3.5 + 's';
      
      const minSize = 28;
      const maxSize = 46;
      item.style.fontSize = Math.random() * (maxSize - minSize) + minSize + 'px';
      item.style.filter = 'drop-shadow(0 0 8px rgba(255, 117, 24, 0.9))';

      document.body.appendChild(item);

      setTimeout(() => {
        item.remove();
      }, 6000);
    }

    const fallInterval = setInterval(createFallingElement, 150);

    // Ocultar overlay tras finalizar la secuencia (9.2s)
    setTimeout(() => {
      const overlay = document.getElementById('halloween-overlay');
      overlay.style.opacity = '0';
      overlay.style.visibility = 'hidden';
      clearInterval(fallInterval);
    }, 9200);

    var modal = document.getElementById("myModal");
    var modalImg = document.getElementById("img01");
    var images = Array.from(document.getElementsByClassName('clickable-img'));
    var currentIndex = 0;

    function openModal(index) {
      currentIndex = index;
      modal.style.display = "flex";
      modalImg.src = images[currentIndex].src;
    }

    function changeImage(newIndex) {
      currentIndex = newIndex;
      modalImg.classList.remove("fade-anim");
      void modalImg.offsetWidth;
      modalImg.src = images[currentIndex].src;
      modalImg.classList.add("fade-anim");
    }

    images.forEach((img, index) => {
      img.onclick = function() {
        openModal(index);
      }
    });

    document.getElementById("prevBtn").onclick = function(e) {
      e.stopPropagation();
      var nextIdx = (currentIndex > 0) ? currentIndex - 1 : images.length - 1;
      changeImage(nextIdx);
    };

    document.getElementById("nextBtn").onclick = function(e) {
      e.stopPropagation();
      var nextIdx = (currentIndex < images.length - 1) ? currentIndex + 1 : 0;
      changeImage(nextIdx);
    };

    var span = document.getElementsByClassName("close")[0];
    span.onclick = function() {
      modal.style.display = "none";
    };

    modal.onclick = function(event) {
      if (event.target == modal) {
        modal.style.display = "none";
      }
    };
  </script>

</body>
</html>
