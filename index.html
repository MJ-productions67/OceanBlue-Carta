<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bienvenido Ocean Blue</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: linear-gradient(135deg, #02111b 0%, #002b49 50%, #00497a 100%);
      color: #ffffff;
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      overflow-x: hidden;
      position: relative;
      padding: 30px 15px;
    }

    body::after {
      content: "";
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: radial-gradient(circle at 50% 50%, rgba(0, 180, 216, 0.15), transparent 70%);
      pointer-events: none;
    }

    h1 {
      font-family: 'Great Vibes', cursive;
      font-size: 3.5rem;
      color: #90e0ef;
      text-shadow: 0 0 15px rgba(144, 224, 239, 0.6);
      margin-bottom: 25px;
      text-align: center;
      z-index: 2;
    }

    .layout-container {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      max-width: 500px;
      z-index: 2;
    }

    .whirlpool-bg {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 400px;
      height: 400px;
      border-radius: 50%;
      background: conic-gradient(from 0deg, transparent, #0077b6, #00b4d8, #90e0ef, transparent 80%);
      animation: spin 10s linear infinite;
      filter: blur(14px);
      box-shadow: 0 0 50px rgba(0, 180, 216, 0.4);
      z-index: 1;
      opacity: 0.5;
      pointer-events: none;
    }

    @keyframes spin {
      0% { transform: translate(-50%, -50%) rotate(0deg); }
      100% { transform: translate(-50%, -50%) rotate(360deg); }
    }

    /* CONTENEDOR VERTICAL PARA PC Y MÓVIL */
    .carrusel {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      gap: 25px;
      width: 100%;
      align-items: center;
    }

    .carta {
      width: 100%;
      max-width: 320px;
      height: 440px;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
      border: 2px solid rgba(144, 224, 239, 0.4);
      flex-shrink: 0;
      transition: transform 0.3s, border-color 0.3s;
      background-color: #00121e;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
    }

    .carta:hover, .carta:active {
      transform: scale(1.02);
      border-color: #90e0ef;
    }

    /* IMAGEN COMPLETA SIN RECORTAR */
    .carta img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 12px;
    }

    .modal {
      display: none;
      position: fixed;
      z-index: 10;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      overflow: auto;
      background-color: rgba(0, 18, 30, 0.95);
      backdrop-filter: blur(5px);
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      margin: auto;
      display: block;
      max-width: 90%;
      max-height: 85vh;
      border-radius: 18px;
      box-shadow: 0 0 40px rgba(144, 224, 239, 0.5);
      border: 3px solid #90e0ef;
      animation: zoom 0.4s;
      object-fit: contain;
    }

    .fade-anim {
      animation: fadeEffect 0.35s ease-in-out;
    }

    @keyframes zoom {
      from {transform:scale(0.7); opacity: 0;}
      to {transform:scale(1); opacity: 1;}
    }

    @keyframes fadeEffect {
      from {opacity: 0.3; transform: scale(0.97);}
      to {opacity: 1; transform: scale(1);}
    }

    .close {
      position: absolute;
      top: 20px;
      right: 20px;
      color: #90e0ef;
      font-size: 40px;
      font-weight: bold;
      transition: 0.3s;
      cursor: pointer;
      z-index: 12;
      line-height: 1;
    }

    .close:hover {
      color: #ffffff;
    }

    .nav-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background-color: rgba(0, 18, 30, 0.8);
      color: #90e0ef;
      font-size: 26px;
      font-weight: bold;
      border: 2px solid #90e0ef;
      padding: 8px 14px;
      border-radius: 50%;
      cursor: pointer;
      transition: 0.3s;
      user-select: none;
      z-index: 11;
    }

    .nav-btn:active {
      background-color: #00b4d8;
      color: #00121e;
    }

    .prev {
      left: 15px;
    }

    .next {
      right: 15px;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 2.7rem;
      }

      .carta {
        max-width: 280px;
        height: 390px;
      }

      .whirlpool-bg {
        width: 300px;
        height: 300px;
      }
    }
  </style>
</head>
<body>

  <h1>Bienvenido Ocean Blue</h1>

  <div class="layout-container">
    <div class="whirlpool-bg"></div>

    <div class="carrusel">
      <div class="carta"><img src="imagen1.png" alt="Carta 1" class="clickable-img"></div>
      <div class="carta"><img src="imagen2.png" alt="Carta 2" class="clickable-img"></div>
      <div class="carta"><img src="imagen3.png" alt="Carta 3" class="clickable-img"></div>
      <div class="carta"><img src="imagen4.png" alt="Carta 4" class="clickable-img"></div>
    </div>
  </div>

  <div id="myModal" class="modal">
    <span class="close">&times;</span>
    <button class="nav-btn prev" id="prevBtn">&#10094;</button>
    <img class="modal-content" id="img01">
    <button class="nav-btn next" id="nextBtn">&#10095;</button>
  </div>

  <script>
    var modal = document.getElementById("myModal");
    var modalImg = document.getElementById("img01");
    var images = Array.from(document.getElementsByClassName('clickable-img'));
    var currentIndex = 0;

    function openModal(index) {
      currentIndex = index;
      modal.style.display = "flex";
      modalImg.src = images[currentIndex].src;
    }

    function changeImage(newIndex) {
      currentIndex = newIndex;
      modalImg.classList.remove("fade-anim");
      void modalImg.offsetWidth;
      modalImg.src = images[currentIndex].src;
      modalImg.classList.add("fade-anim");
    }

    images.forEach((img, index) => {
      img.onclick = function() {
        openModal(index);
      }
    });

    document.getElementById("prevBtn").onclick = function(e) {
      e.stopPropagation();
      var nextIdx = (currentIndex > 0) ? currentIndex - 1 : images.length - 1;
      changeImage(nextIdx);
    };

    document.getElementById("nextBtn").onclick = function(e) {
      e.stopPropagation();
      var nextIdx = (currentIndex < images.length - 1) ? currentIndex + 1 : 0;
      changeImage(nextIdx);
    };

    var span = document.getElementsByClassName("close")[0];
    span.onclick = function() {
      modal.style.display = "none";
    };

    modal.onclick = function(event) {
      if (event.target == modal) {
        modal.style.display = "none";
      }
    };
  </script>

</body>
</html>
