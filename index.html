<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bienvenidos a Ocean Blue</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: linear-gradient(135deg, #02111b 0%, #002b49 50%, #00497a 100%);
      color: #ffffff;
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      overflow-x: hidden;
      position: relative;
      padding: 30px 15px;
    }

    body::after {
      content: "";
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: radial-gradient(circle at 50% 50%, rgba(0, 180, 216, 0.15), transparent 70%);
      pointer-events: none;
    }

    /* OVERLAY DE SAN VALENTÍN */
    #valentine-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(2, 17, 27, 0.45);
      z-index: 100;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding-top: 5vh;
      overflow: hidden;
      pointer-events: none;
      transition: opacity 1.2s ease, visibility 1.2s ease;
    }

    .valentine-container {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      transform: translateY(-120vh);
      animation: dropEntireScene 1.4s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }

    @keyframes dropEntireScene {
      0% { transform: translateY(-120vh); }
      100% { transform: translateY(0); }
    }

    /* CARTEL COLGANTE EN DIAGONAL (DE MEDIO LADO) */
    .hanging-sign-wrapper {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      transform-origin: top center;
      animation: signSwing 3.5s ease-in-out infinite alternate;
      z-index: 5;
    }

    .sign-rope-left, .sign-rope-right {
      position: absolute;
      top: -120px;
      width: 2px;
      height: 125px;
      background: linear-gradient(to bottom, rgba(255,255,255,0.2), #d4a373);
      box-shadow: 0 0 3px rgba(212, 163, 115, 0.8);
    }

    .sign-rope-left { left: 15%; }
    .sign-rope-right { right: 15%; }

    .valentine-title-board {
      font-family: 'Fredoka', cursive, sans-serif;
      font-size: 1.4rem;
      font-weight: 700;
      color: #fff0f5;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      padding: 14px 24px;
      background: linear-gradient(135deg, #3a0ca3, #7209b7, #f72585);
      border: 3px solid #ffb3c1;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5), 0 0 18px rgba(247, 37, 133, 0.8);
      transform: rotate(-6deg); /* INCLINADO DE MEDIO LADO */
      max-width: 340px;
      line-height: 1.3;
    }

    @keyframes signSwing {
      0% { transform: rotate(-3deg); }
      100% { transform: rotate(3deg); }
    }

    /* ESCENA CUPIDO + CORAZÓN COLGANDO */
    .cupid-stage {
      position: relative;
      width: 380px;
      height: 220px;
      margin-top: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* CUERDA Y FIGURA DE CUPIDO */
    .cupid-hanger {
      position: absolute;
      left: 10px;
      top: -40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      transform-origin: top center;
      animation: cupidSwing 2.8s ease-in-out infinite alternate;
    }

    .cupid-rope {
      width: 2px;
      height: 80px;
      background: linear-gradient(to bottom, rgba(255,255,255,0.2), #d4a373);
      box-shadow: 0 0 3px rgba(212, 163, 115, 0.8);
    }

    .cupid-img {
      width: 150px;
      height: auto;
      filter: drop-shadow(0 0 15px rgba(255, 182, 193, 0.9));
      margin-top: -5px;
    }

    /* CUERDA Y FIGURA DEL CORAZÓN */
    .heart-hanger {
      position: absolute;
      right: 10px;
      top: -40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      transform-origin: top center;
      animation: heartSwing 2.3s ease-in-out infinite alternate;
    }

    .heart-rope {
      width: 2px;
      height: 95px;
      background: linear-gradient(to bottom, rgba(255,255,255,0.2), #d4a373);
      box-shadow: 0 0 3px rgba(212, 163, 115, 0.8);
    }

    .heart-full {
      width: 95px;
      height: auto;
      filter: drop-shadow(0 0 22px rgba(255, 0, 85, 0.95));
      animation: heartPulse 0.7s ease-in-out infinite alternate;
      margin-top: -5px;
    }

    .arrow-svg {
      position: absolute;
      left: 130px;
      top: 90px;
      width: 85px;
      height: auto;
      filter: drop-shadow(0 0 10px #ff2a6d);
      opacity: 0;
      animation: shootArrow 2.5s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      animation-delay: 1.5s;
    }

    @keyframes cupidSwing {
      0% { transform: rotate(-5deg); }
      100% { transform: rotate(5deg); }
    }

    @keyframes heartSwing {
      0% { transform: rotate(4deg); }
      100% { transform: rotate(-4deg); }
    }

    @keyframes heartPulse {
      0% { transform: scale(1); }
      100% { transform: scale(1.18); }
    }

    @keyframes shootArrow {
      0% { left: 130px; opacity: 0; transform: scale(0.6); }
      20% { opacity: 1; }
      70% { left: 250px; opacity: 1; transform: scale(1); }
      85% { left: 265px; opacity: 1; transform: scale(1.4); }
      100% { left: 270px; opacity: 0; transform: scale(1.8); }
    }

    /* ELEMENTOS QUE CAEN DEL FONDO */
    .falling-item {
      position: fixed;
      top: -12%;
      user-select: none;
      pointer-events: none;
      z-index: 99;
      animation: fall linear forwards;
    }

    @keyframes fall {
      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 1;
      }
      100% {
        transform: translateY(108vh) rotate(360deg);
        opacity: 0;
      }
    }

    /* HEADER DE LA PÁGINA */
    .header-container {
      text-align: center;
      margin-bottom: 25px;
      z-index: 2;
      padding: 0 10px;
    }

    h1 {
      font-family: 'Fredoka', cursive, sans-serif;
      font-size: 2.8rem;
      font-weight: 700;
      color: #ffffff;
      text-transform: uppercase;
      line-height: 1.1;
      letter-spacing: 1.5px;
      -webkit-text-stroke: 1.5px #22d3ee;
      animation: neonStrokeFlow 3s linear infinite;
    }

    .subtitle {
      font-family: 'Poppins', sans-serif;
      font-size: 1.1rem;
      font-weight: 400;
      color: #90e0ef;
      margin-top: 10px;
      letter-spacing: 0.8px;
      filter: drop-shadow(0 0 5px #00b4d8);
    }

    @keyframes neonStrokeFlow {
      0% { filter: drop-shadow(4px 0px 4px #22d3ee) drop-shadow(-4px 0px 12px #0077b6); }
      25% { filter: drop-shadow(0px 4px 4px #90e0ef) drop-shadow(0px -4px 12px #00b4d8); }
      50% { filter: drop-shadow(-4px 0px 4px #22d3ee) drop-shadow(4px 0px 12px #0077b6); }
      75% { filter: drop-shadow(0px -4px 4px #90e0ef) drop-shadow(0px 4px 12px #00b4d8); }
      100% { filter: drop-shadow(4px 0px 4px #22d3ee) drop-shadow(-4px 0px 12px #0077b6); }
    }

    .layout-container {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      max-width: 500px;
      z-index: 2;
    }

    .whirlpool-bg {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 400px;
      height: 400px;
      border-radius: 50%;
      background: conic-gradient(from 0deg, transparent, #0077b6, #00b4d8, #90e0ef, transparent 80%);
      animation: spin 10s linear infinite;
      filter: blur(14px);
      box-shadow: 0 0 50px rgba(0, 180, 216, 0.4);
      z-index: 1;
      opacity: 0.5;
      pointer-events: none;
    }

    @keyframes spin {
      0% { transform: translate(-50%, -50%) rotate(0deg); }
      100% { transform: translate(-50%, -50%) rotate(360deg); }
    }

    .carrusel {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      gap: 25px;
      width: 100%;
      align-items: center;
    }

    .carta {
      position: relative;
      width: 100%;
      max-width: 400px;
      height: auto;
      border-radius: 20px;
      overflow: hidden;
      flex-shrink: 0;
      transition: transform 0.3s;
      background: #00121e;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3px;
    }

    .carta::before {
      content: '';
      position: absolute;
      width: 150%;
      height: 150%;
      background: conic-gradient(transparent, #22d3ee, #90e0ef, transparent 40%);
      animation: rotateBorder 4s linear infinite;
    }

    .carta::after {
      content: '';
      position: absolute;
      inset: 3px;
      background: #00121e;
      border-radius: 17px;
      z-index: 1;
    }

    @keyframes rotateBorder {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .carta:hover, .carta:active {
      transform: scale(1.02);
    }

    .carta img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 17px;
      position: relative;
      z-index: 2;
    }

    .notice-card {
      margin-top: 35px;
      width: 100%;
      max-width: 400px;
      background: rgba(0, 27, 46, 0.85);
      border: 2px solid #22d3ee;
      border-radius: 20px;
      padding: 20px 22px;
      text-align: center;
      box-shadow: 0 0 25px rgba(34, 211, 238, 0.3), inset 0 0 15px rgba(0, 180, 216, 0.15);
      backdrop-filter: blur(8px);
      z-index: 2;
      position: relative;
    }

    .notice-card p {
      font-family: 'Fredoka', cursive, sans-serif;
      font-size: 1.25rem;
      font-weight: 500;
      color: #e0f7fa;
      line-height: 1.45;
      letter-spacing: 0.3px;
    }

    .notice-card span.highlight {
      color: #22d3ee;
      font-weight: 700;
      text-shadow: 0 0 8px rgba(34, 211, 238, 0.6);
    }

    .modal {
      display: none;
      position: fixed;
      z-index: 10;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      overflow: auto;
      background-color: rgba(0, 18, 30, 0.95);
      backdrop-filter: blur(5px);
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 10px;
    }

    .modal-content-wrapper {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 95%;
      max-height: 80vh;
    }

    .modal-content {
      width: 100%;
      max-height: 75vh;
      border-radius: 18px;
      box-shadow: 0 0 40px rgba(144, 224, 239, 0.5);
      border: 3px solid #90e0ef;
      animation: zoom 0.3s;
      object-fit: contain;
    }

    .fade-anim {
      animation: fadeEffect 0.3s ease-in-out;
    }

    @keyframes zoom {
      from {transform:scale(0.7); opacity: 0;}
      to {transform:scale(1); opacity: 1;}
    }

    @keyframes fadeEffect {
      from {opacity: 0.3; transform: scale(0.97);}
      to {opacity: 1; transform: scale(1);}
    }

    .close {
      position: fixed;
      top: 15px;
      right: 15px;
      color: #90e0ef;
      font-size: 35px;
      font-weight: bold;
      transition: 0.3s;
      cursor: pointer;
      z-index: 12;
      line-height: 1;
      background-color: rgba(0, 18, 30, 0.8);
      border: 1px solid #90e0ef;
      border-radius: 50%;
      width: 45px;
      height: 45px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .close:hover {
      color: #ffffff;
    }

    .controls-bar {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      margin-top: 15px;
      z-index: 11;
    }

    .nav-btn {
      background-color: rgba(0, 43, 73, 0.9);
      color: #90e0ef;
      font-size: 20px;
      font-weight: bold;
      border: 2px solid #90e0ef;
      padding: 8px 20px;
      border-radius: 25px;
      cursor: pointer;
      transition: 0.3s;
      user-select: none;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
    }

    .nav-btn:active {
      background-color: #00b4d8;
      color: #00121e;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 2.2rem;
      }

      .subtitle {
        font-size: 0.95rem;
      }

      .valentine-title-board {
        font-size: 1.15rem;
        padding: 10px 18px;
        max-width: 280px;
      }

      .cupid-stage {
        width: 310px;
        height: 180px;
      }

      .cupid-img {
        width: 120px;
      }

      .heart-full {
        width: 80px;
      }

      .arrow-svg {
        left: 100px;
        top: 75px;
        width: 65px;
      }

      .notice-card p {
        font-size: 1.1rem;
      }

      .whirlpool-bg {
        width: 300px;
        height: 300px;
      }
    }
  </style>
</head>
<body>

  <div id="valentine-overlay">
    <div class="valentine-container">
      
      <!-- CARTEL COLGANTE EN DIAGONAL CON CUERDAS -->
      <div class="hanging-sign-wrapper">
        <div class="sign-rope-left"></div>
        <div class="sign-rope-right"></div>
        <div class="valentine-title-board">
          Ocean Blue les desea un feliz día de San Valentín
        </div>
      </div>

      <!-- CUPIDO Y CORAZÓN COLGANDO DE CUERDAS -->
      <div class="cupid-stage">
        
        <!-- CUPIDO CON CUERDA -->
        <div class="cupid-hanger">
          <div class="cupid-rope"></div>
          <img src="cupido.png" class="cupid-img" alt="Cupido">
        </div>

        <!-- FLECHA VOADORA -->
        <svg class="arrow-svg" viewBox="0 0 100 20" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M5 10 L85 10" stroke="#ff2a6d" stroke-width="4" stroke-linecap="round"/>
          <path d="M80 3 L95 10 L80 17 Z" fill="#ff2a6d"/>
          <path d="M5 10 L0 3 M5 10 L0 17 M10 10 L5 3 M10 10 L5 17" stroke="#ffffff" stroke-width="2"/>
        </svg>

        <!-- CORAZÓN CON CUERDA -->
        <div class="heart-hanger">
          <div class="heart-rope"></div>
          <svg class="heart-full" viewBox="0 0 100 90" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M50 85 C50 85 10 55 10 30 C10 15 22 5 35 5 C43 5 48 10 50 15 C52 10 57 5 65 5 C78 5 90 15 90 30 C90 55 50 85 50 85 Z" fill="#ff0055"/>
            <path d="M25 20 A 8 8 0 0 1 35 12" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
          </svg>
        </div>

      </div>

    </div>
  </div>

  <div class="header-container">
    <h1>Bienvenidos a Ocean Blue</h1>
    <p class="subtitle">Es un placer que nos visiten</p>
  </div>

  <div class="layout-container">
    <div class="whirlpool-bg"></div>

    <div class="carrusel">
      <div class="carta"><img src="imagen1.png" alt="Carta 1" class="clickable-img"></div>
      <div class="carta"><img src="imagen2.png" alt="Carta 2" class="clickable-img"></div>
      <div class="carta"><img src="imagen3.png" alt="Carta 3" class="clickable-img"></div>
      <div class="carta"><img src="imagen4.png" alt="Carta 4" class="clickable-img"></div>
    </div>
  </div>

  <div class="notice-card">
    <p>Hola, ¿ya revisaste bien nuestro menú? Recuerda que somos <span class="highlight">autoservicio</span>, el siguiente paso es acercarte a caja para realizar tu pedido, ¡muchas gracias por tu compra!</p>
  </div>

  <div id="myModal" class="modal">
    <span class="close">&times;</span>
    <div class="modal-content-wrapper">
      <img class="modal-content" id="img01">
      <div class="controls-bar">
        <button class="nav-btn" id="prevBtn">&#10094; Anterior</button>
        <button class="nav-btn" id="nextBtn">Siguiente &#10095;</button>
      </div>
    </div>
  </div>

  <script>
    function createFallingElement() {
      const item = document.createElement('div');
      item.classList.add('falling-item');
      
      const itemsList = [
        '❤️', '💖', '💕', '💗', '💘', '💝', 
        '🍬', '🍭', '🧁', '🍫', 
        '✨', '🎊', '🎉', '🌸', '⚡'
      ];
      
      const selectedItem = itemsList[Math.floor(Math.random() * itemsList.length)];
      item.innerText = selectedItem;
      
      item.style.left = Math.random() * 100 + 'vw';
      item.style.animationDuration = Math.random() * 2 + 3.5 + 's';
      
      const isHeart = ['❤️', '💖', '💕', '💗', '💘', '💝'].includes(selectedItem);
      const minSize = isHeart ? 32 : 24;
      const maxSize = isHeart ? 48 : 36;
      
      item.style.fontSize = Math.random() * (maxSize - minSize) + minSize + 'px';
      
      if (isHeart) {
        item.style.filter = 'drop-shadow(0 0 8px rgba(255, 77, 109, 0.9))';
      } else {
        item.style.filter = 'drop-shadow(0 0 6px rgba(255, 255, 255, 0.7))';
      }

      document.body.appendChild(item);

      setTimeout(() => {
        item.remove();
      }, 6000);
    }

    const fallInterval = setInterval(createFallingElement, 150);

    // Ocultar la animación de San Valentín tras 6.8 segundos
    setTimeout(() => {
      const overlay = document.getElementById('valentine-overlay');
      overlay.style.opacity = '0';
      overlay.style.visibility = 'hidden';
      clearInterval(fallInterval);
    }, 6800);

    var modal = document.getElementById("myModal");
    var modalImg = document.getElementById("img01");
    var images = Array.from(document.getElementsByClassName('clickable-img'));
    var currentIndex = 0;

    function openModal(index) {
      currentIndex = index;
      modal.style.display = "flex";
      modalImg.src = images[currentIndex].src;
    }

    function changeImage(newIndex) {
      currentIndex = newIndex;
      modalImg.classList.remove("fade-anim");
      void modalImg.offsetWidth;
      modalImg.src = images[currentIndex].src;
      modalImg.classList.add("fade-anim");
    }

    images.forEach((img, index) => {
      img.onclick = function() {
        openModal(index);
      }
    });

    document.getElementById("prevBtn").onclick = function(e) {
      e.stopPropagation();
      var nextIdx = (currentIndex > 0) ? currentIndex - 1 : images.length - 1;
      changeImage(nextIdx);
    };

    document.getElementById("nextBtn").onclick = function(e) {
      e.stopPropagation();
      var nextIdx = (currentIndex < images.length - 1) ? currentIndex + 1 : 0;
      changeImage(nextIdx);
    };

    var span = document.getElementsByClassName("close")[0];
    span.onclick = function() {
      modal.style.display = "none";
    };

    modal.onclick = function(event) {
      if (event.target == modal) {
        modal.style.display = "none";
      }
    };
  </script>

</body>
</html>
