<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bienvenidos a Ocean Blue</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: linear-gradient(135deg, #02111b 0%, #002b49 50%, #00497a 100%);
      color: #ffffff;
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      overflow-x: hidden;
      position: relative;
      padding: 30px 15px;
    }

    body::after {
      content: "";
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: radial-gradient(circle at 50% 50%, rgba(0, 180, 216, 0.15), transparent 70%);
      pointer-events: none;
    }

    .header-container {
      text-align: center;
      margin-bottom: 25px;
      z-index: 2;
      padding: 0 10px;
    }

    h1 {
      font-family: 'Fredoka', cursive, sans-serif;
      font-size: 2.8rem;
      font-weight: 700;
      color: #ffffff;
      text-transform: uppercase;
      line-height: 1.1;
      letter-spacing: 1.5px;
      -webkit-text-stroke: 1.5px #22d3ee;
      animation: neonStrokeFlow 3s linear infinite;
    }

    .subtitle {
      font-family: 'Poppins', sans-serif;
      font-size: 1.1rem;
      font-weight: 400;
      color: #90e0ef;
      margin-top: 10px;
      letter-spacing: 0.8px;
      filter: drop-shadow(0 0 5px #00b4d8);
    }

    @keyframes neonStrokeFlow {
      0% {
        filter: drop-shadow(4px 0px 4px #22d3ee) drop-shadow(-4px 0px 12px #0077b6);
      }
      25% {
        filter: drop-shadow(0px 4px 4px #90e0ef) drop-shadow(0px -4px 12px #00b4d8);
      }
      50% {
        filter: drop-shadow(-4px 0px 4px #22d3ee) drop-shadow(4px 0px 12px #0077b6);
      }
      75% {
        filter: drop-shadow(0px -4px 4px #90e0ef) drop-shadow(0px 4px 12px #00b4d8);
      }
      100% {
        filter: drop-shadow(4px 0px 4px #22d3ee) drop-shadow(-4px 0px 12px #0077b6);
      }
    }

    .layout-container {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      max-width: 500px;
      z-index: 2;
    }

    .whirlpool-bg {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 400px;
      height: 400px;
      border-radius: 50%;
      background: conic-gradient(from 0deg, transparent, #0077b6, #00b4d8, #90e0ef, transparent 80%);
      animation: spin 10s linear infinite;
      filter: blur(14px);
      box-shadow: 0 0 50px rgba(0, 180, 216, 0.4);
      z-index: 1;
      opacity: 0.5;
      pointer-events: none;
    }

    @keyframes spin {
      0% { transform: translate(-50%, -50%) rotate(0deg); }
      100% { transform: translate(-50%, -50%) rotate(360deg); }
    }

    .carrusel {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      gap: 25px;
      width: 100%;
      align-items: center;
    }

    .carta {
      position: relative;
      width: 100%;
      max-width: 400px;
      height: auto;
      border-radius: 20px;
      overflow: hidden;
      flex-shrink: 0;
      transition: transform 0.3s;
      background: #00121e;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3px;
    }

    .carta::before {
      content: '';
      position: absolute;
      width: 150%;
      height: 150%;
      background: conic-gradient(transparent, #22d3ee, #90e0ef, transparent 40%);
      animation: rotateBorder 4s linear infinite;
    }

    .carta::after {
      content: '';
      position: absolute;
      inset: 3px;
      background: #00121e;
      border-radius: 17px;
      z-index: 1;
    }

    @keyframes rotateBorder {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .carta:hover, .carta:active {
      transform: scale(1.02);
    }

    .carta img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 17px;
      position: relative;
      z-index: 2;
    }

    .notice-card {
      margin-top: 35px;
      width: 100%;
      max-width: 400px;
      background: rgba(0, 27, 46, 0.85);
      border: 2px solid #22d3ee;
      border-radius: 20px;
      padding: 20px 22px;
      text-align: center;
      box-shadow: 0 0 25px rgba(34, 211, 238, 0.3), inset 0 0 15px rgba(0, 180, 216, 0.15);
      backdrop-filter: blur(8px);
      z-index: 2;
      position: relative;
    }

    .notice-card p {
      font-family: 'Fredoka', cursive, sans-serif;
      font-size: 1.25rem;
      font-weight: 500;
      color: #e0f7fa;
      line-height: 1.45;
      letter-spacing: 0.3px;
    }

    .notice-card span.highlight {
      color: #22d3ee;
      font-weight: 700;
      text-shadow: 0 0 8px rgba(34, 211, 238, 0.6);
    }

    .modal {
      display: none;
      position: fixed;
      z-index: 10;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      overflow: auto;
      background-color: rgba(0, 18, 30, 0.95);
      backdrop-filter: blur(5px);
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 10px;
    }

    .modal-content-wrapper {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 95%;
      max-height: 80vh;
    }

    .modal-content {
      width: 100%;
      max-height: 75vh;
      border-radius: 18px;
      box-shadow: 0 0 40px rgba(144, 224, 239, 0.5);
      border: 3px solid #90e0ef;
      animation: zoom 0.3s;
      object-fit: contain;
    }

    .fade-anim {
      animation: fadeEffect 0.3s ease-in-out;
    }

    @keyframes zoom {
      from {transform:scale(0.7); opacity: 0;}
      to {transform:scale(1); opacity: 1;}
    }

    @keyframes fadeEffect {
      from {opacity: 0.3; transform: scale(0.97);}
      to {opacity: 1; transform: scale(1);}
    }

    .close {
      position: fixed;
      top: 15px;
      right: 15px;
      color: #90e0ef;
      font-size: 35px;
      font-weight: bold;
      transition: 0.3s;
      cursor: pointer;
      z-index: 12;
      line-height: 1;
      background-color: rgba(0, 18, 30, 0.8);
      border: 1px solid #90e0ef;
      border-radius: 50%;
      width: 45px;
      height: 45px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .close:hover {
      color: #ffffff;
    }

    .controls-bar {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      margin-top: 15px;
      z-index: 11;
    }

    .nav-btn {
      background-color: rgba(0, 43, 73, 0.9);
      color: #90e0ef;
      font-size: 20px;
      font-weight: bold;
      border: 2px solid #90e0ef;
      padding: 8px 20px;
      border-radius: 25px;
      cursor: pointer;
      transition: 0.3s;
      user-select: none;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
    }

    .nav-btn:active {
      background-color: #00b4d8;
      color: #00121e;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 2.2rem;
      }

      .subtitle {
        font-size: 0.95rem;
      }

      .notice-card p {
        font-size: 1.1rem;
      }

      .whirlpool-bg {
        width: 300px;
        height: 300px;
      }
    }
  </style>
</head>
<body>

  <div class="header-container">
    <h1>Bienvenidos a Ocean Blue</h1>
    <p class="subtitle">Es un placer que nos visiten</p>
  </div>

  <div class="layout-container">
    <div class="whirlpool-bg"></div>

    <div class="carrusel">
      <div class="carta"><img src="imagen1.png" alt="Carta 1" class="clickable-img"></div>
      <div class="carta"><img src="imagen2.png" alt="Carta 2" class="clickable-img"></div>
      <div class="carta"><img src="imagen3.png" alt="Carta 3" class="clickable-img"></div>
      <div class="carta"><img src="imagen4.png" alt="Carta 4" class="clickable-img"></div>
    </div>
  </div>

  <div class="notice-card">
    <p>Hola, ¿ya revisaste bien nuestro menú? Recuerda que somos <span class="highlight">autoservicio</span>, el siguiente paso es acercarte a caja para realizar tu pedido, ¡muchas gracias por tu compra!</p>
  </div>

  <div id="myModal" class="modal">
    <span class="close">&times;</span>
    <div class="modal-content-wrapper">
      <img class="modal-content" id="img01">
      <div class="controls-bar">
        <button class="nav-btn" id="prevBtn">&#10094; Anterior</button>
        <button class="nav-btn" id="nextBtn">Siguiente &#10095;</button>
      </div>
    </div>
  </div>

  <script>
    var modal = document.getElementById("myModal");
    var modalImg = document.getElementById("img01");
    var images = Array.from(document.getElementsByClassName('clickable-img'));
    var currentIndex = 0;

    function openModal(index) {
      currentIndex = index;
      modal.style.display = "flex";
      modalImg.src = images[currentIndex].src;
    }

    function changeImage(newIndex) {
      currentIndex = newIndex;
      modalImg.classList.remove("fade-anim");
      void modalImg.offsetWidth;
      modalImg.src = images[currentIndex].src;
      modalImg.classList.add("fade-anim");
    }

    images.forEach((img, index) => {
      img.onclick = function() {
        openModal(index);
      }
    });

    document.getElementById("prevBtn").onclick = function(e) {
      e.stopPropagation();
      var nextIdx = (currentIndex > 0) ? currentIndex - 1 : images.length - 1;
      changeImage(nextIdx);
    };

    document.getElementById("nextBtn").onclick = function(e) {
      e.stopPropagation();
      var nextIdx = (currentIndex < images.length - 1) ? currentIndex + 1 : 0;
      changeImage(nextIdx);
    };

    var span = document.getElementsByClassName("close")[0];
    span.onclick = function() {
      modal.style.display = "none";
    };

    modal.onclick = function(event) {
      if (event.target == modal) {
        modal.style.display = "none";
      }
    };
  </script>

</body>
</html>
